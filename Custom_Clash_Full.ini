    - 日本节点
    - 新加坡节点
    - 台湾节点
    - 韩国节点
    - 加拿大节点
    - 英国
    - 法国
    - 德国
    - 荷兰节点
    - 土耳其节点
    - 家宽节点
    - 其他地区
    - 马来西亚节点
  use: [Subscription]

x-direct-first: &direct-first
  type: select
  proxies:
    - 全球直连
    - 香港负载均衡
