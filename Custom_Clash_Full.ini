# Custom_Clash_Full.ini 的 Mihomo/OpenClash 独立 YAML 版本
# 将下方 SUBSCRIPTION_URL 替换为 Clash Proxy Provider 或 Sub-Store 输出地址。
# 如果机场仅提供 Base64/通用订阅，请先通过 Sub-Store 转为 Clash Provider。

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  Subscription:
    type: http
    url: "SUBSCRIPTION_URL"
    path: ./proxy_provider/subscription.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
    override:
      skip-cert-verify: true
      udp: true
    filter: '^(?!.*(群|邀请|返利|官网|客服|网址|订阅|流量|到期|机场|过期|已用|联系|邮箱|工单|通知|说明|教程|更新|作者|USE|USED|TOTAL|EXPIRE|EMAIL)).*$'

x-service-static: &service-static
  type: select
  proxies: &service-proxies
    - 手动选择
    - 香港负载均衡
    - 新加坡负载均衡
    - 高速优选|大带宽
    - 自动选择
    - 香港节点
    - 美国节点
    - 日本节点
    - 新加坡节点
    - 台湾节点
    - 韩国节点
    - 加拿大节点
    - 英国
    - 法国
    - 德国
    - 荷兰节点
    - 土耳其节点
    - 家宽节点
    - 其他地区
    - 马来西亚节点
    - 全球直连

x-service: &service
  <<: *service-static
  use: [Subscription]

x-service-no-direct: &service-no-direct
  type: select
  proxies:
    - 手动选择
    - 香港负载均衡
    - 新加坡负载均衡
