    interval: 28800
  custom-proxy:
    type: http
    behavior: classical
    format: text
    path: ./rule_provider/custom-proxy.list
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Proxy.list"
    interval: 28800
  steam-cdn:
    type: http
    behavior: classical
    format: text
    path: ./rule_provider/steam-cdn.list
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Steam_CDN.list"
    interval: 28800
