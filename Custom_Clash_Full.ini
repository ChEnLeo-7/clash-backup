    - 台湾节点
    - 韩国节点
    - 加拿大节点
    - 英国
    - 法国
    - 德国
    - 荷兰节点
    - 土耳其节点
    - 家宽节点
    - 其他地区
    - 马来西亚节点
    - 手动选择
    - 自动选择

